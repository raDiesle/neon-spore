<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Spore — VERSUS</title>
    <!--
      One look, on a page of its own. Opened from the director's VERSUS tab
      (`src/versus-tab.ts`) and routed by its query string alone
      (`src/versus-app.ts`): `?slot=…&name=…` for one candidate against what
      the game draws today, `?page=animations` for the baked-animation
      examples.

      Only the four sheets this page's own markup uses, imported by
      `src/versus.css` in the same order `src/director.css` takes them in —
      the cascade is one cascade whichever page is reading it, so a sheet
      moved relative to another can change which of two equally specific
      rules wins. Nothing here builds a column, a map or a phone menu, so
      those sheets are not loaded.
    -->
    <link rel="stylesheet" href="./src/versus.css" />
  </head>
  <body class="standalone">
    <div id="standalone" class="sheetpage"></div>
    <script type="module" src="./src/versus-app.ts"></script>
  </body>
</html>
