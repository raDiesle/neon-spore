# The implementation worker. Opus orchestrates and reviews, this types.
# Driven from .claude/skills/delegate, never by hand.
# Requires OPENROUTER_API_KEY in the environment.

model: openrouter/z-ai/glm-5.2

# Chosen on hit rate, not on token price. The whole spread from the cheapest
# worker to this one is about the cost of one extra review pass in the
# orchestrating session, so a model that lands it first time is the cheaper
# one even at twenty times the rate.
#
# The cheap end, if a task is trivial enough to be worth the swap:
# model: openrouter/qwen/qwen3-coder-next

# Surgical edits, not regenerated files. Aider will pick `whole` for some
# models on its own, which contradicts the house rule and costs output tokens
# in proportion to file length rather than to the size of the change.
edit-format: diff

# The invariants, handed over as read-only context so they do not have to be
# repeated in every spec.
read:
  - CLAUDE.md
  - docs/INDEX.md

# The contract. Aider re-prompts itself with the failure output until this
# passes, which is the entire point: the retries happen on cheap tokens.
# Every turn of that loop resends the same context — the files, CLAUDE.md, the
# previous attempt. Cached input is roughly a tenth the price of fresh, and it
# is the largest single lever on what a delegated task costs.
cache-prompts: true

test-cmd: bun run check
auto-test: true

# Committing stays with the orchestrator. CLAUDE.md wants only the files a task
# touched, staged by path, one commit per coherent change — none of which a
# worker loop can decide.
auto-commits: false
dirty-commits: false

# Always non-interactive: invoked with --message-file from a single Bash call.
yes-always: true
check-update: false
analytics-disable: true
