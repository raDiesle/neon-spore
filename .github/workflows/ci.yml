name: check

# Pushes to the trunk only. The repository takes no pull requests — history on
# `main` is linear and `bun run land` is the only way in — so a `pull_request`
# trigger was a job that could never fire.
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Read out of `.bun-version` rather than written here. Pinned rather
          # than `latest` for the reason it always was — with `latest`, a Bun
          # release can turn `main` red with no commit behind it and the failure
          # looks like the last landing's fault — but the number now lives in
          # one file that `package.json` and `tools/test/bun-version.test.ts`
          # agree with, so raising it is one edit rather than three.
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # One step, and the same one a session runs before saying "done" —
      # spelling out typecheck, lint and test here made a second definition of
      # `check` that could drift out of step with the first.
      - run: bun run check
