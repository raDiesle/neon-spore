# Per-model settings for the worker. Aider reads this from the repo root.
- name: openrouter/z-ai/glm-5.2
  # Surgical edits, and a repo map so it can see structure it was not handed.
  edit_format: diff
  use_repo_map: true
  # Without this, `cache-prompts` in .aider.conf.yml has nothing to attach the
  # breakpoints to and the cached-input saving quietly does not happen.
  cache_control: true
  extra_params:
    # A ceiling on one reply. Without it a doom loop — the worker repeating
    # itself instead of deciding — runs all the way to the context limit before
    # anything stops it. That happened on the first real task: 65k output
    # tokens spent repeating one clause, an empty file, and a bill several
    # times the cost of the work. Capped, the same failure costs cents and
    # surfaces immediately.
    max_tokens: 8192
    extra_body:
      provider:
        # OpenRouter routes one model across several hosts, and they differ.
        # Heavily quantized weights are measurably worse at code while costing
        # the same, so take only the honest precisions.
        quantizations: [fp8, bf16, fp16]
        # The worker is sent this repository's source. Providers that log
        # prompts are not eligible to see it.
        data_collection: deny
        # Only providers that honour every parameter we send — otherwise the
        # cache breakpoints above are silently dropped by whoever answers.
        require_parameters: true
        allow_fallbacks: true
        # Anthropic models are paid for through a separate account and are
        # never to be billed through OpenRouter. A fallback switches host, not
        # model, so this cannot fire today — it is here so that it still cannot
        # fire after someone changes the model line above without thinking
        # about it.
        ignore: [anthropic]

# Escalation slot, per .claude/skills/delegate: used when the default worker has
# missed twice on the same task. Same provider rules; a larger reply budget,
# because the misses it is meant to answer are replies cut off mid-edit rather
# than wrong ones.
- name: openrouter/moonshotai/kimi-k2.7-code
  edit_format: diff
  use_repo_map: true
  cache_control: true
  extra_params:
    max_tokens: 16384
    extra_body:
      provider:
        quantizations: [fp8, bf16, fp16]
        data_collection: deny
        require_parameters: true
        allow_fallbacks: true
        ignore: [anthropic]
