<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Neon Spore</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #07060f; color: #f2e9dc;
        font-family: "Courier New", monospace; touch-action: none; user-select: none;
      }
      canvas { display: block; width: 100%; height: 100%; }

      /* HUD lives in the DOM on purpose: changing it never touches render/. */
      #hud {
        position: fixed; top: 8px; left: 10px; right: 10px; z-index: 2;
        display: flex; justify-content: space-between;
        font-size: 11px; letter-spacing: 1px; color: #9c8fd6; pointer-events: none;
      }
      #hud b { color: #f2e9dc; font-weight: 600; }

      #controls {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
        height: 34vh; display: grid; gap: 8px; padding: 10px;
        grid-template-rows: auto auto 1fr;
      }
      .strip {
        height: 34px; border: 1px solid #3b3163; border-radius: 10px;
        background: rgba(20, 14, 45, 0.7); display: flex; align-items: center;
        justify-content: center; font-size: 10px; letter-spacing: 2px; color: #9c8fd6;
      }
      #cannonStrip { border-color: #6b5a2e; color: #ffc24b; }
      #shieldStrip { border-color: #1d5560; color: #2fe0f0; }
      .buttons { display: flex; gap: 10px; align-items: center; justify-content: center; }
      .buttons button {
        flex: 1; height: 100%; max-height: 74px; border-radius: 14px;
        border: 1px solid currentColor; background: transparent;
        font: 11px "Courier New", monospace; letter-spacing: 2px;
      }
      #fireRed { color: #ff3b6b; }
      #fireCyan { color: #2fe0f0; }
      #guard { color: #ffc24b; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <span>HULL <b id="hull">100</b></span>
      <span>BEAT <b id="beat">0</b></span>
      <span>GUARD <b id="guardStat">0/0</b></span>
    </div>
    <div id="controls">
      <div class="strip" id="cannonStrip">CANNON — PLAYER 1</div>
      <div class="strip" id="shieldStrip">SHIELD — PLAYER 2</div>
      <div class="buttons">
        <button id="guard">GUARD</button>
        <button id="fireRed">RED</button>
        <button id="fireCyan">CYAN</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
